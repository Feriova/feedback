name: Bug in the planner / Error en el planificador / Erro no planejador
description: Something does not work or looks wrong
labels: [bug]
body:
  - type: input
    id: url
    attributes: { label: Page URL (remove anything personal) }
  - type: textarea
    id: what
    attributes: { label: What happened and what did you expect? }
    validations: { required: true }
  - type: input
    id: device
    attributes: { label: Device / browser }
