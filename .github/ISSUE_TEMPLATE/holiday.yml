name: Holiday data correction / Corrección de festivo / Correção de feriado
description: A holiday date, name or status is wrong or changed
labels: [data]
body:
  - type: dropdown
    id: country
    attributes: { label: Country / País, options: [Colombia, Brasil, Argentina, Chile, Perú] }
    validations: { required: true }
  - type: input
    id: date
    attributes: { label: Date / Fecha / Data (YYYY-MM-DD) }
    validations: { required: true }
  - type: textarea
    id: what
    attributes: { label: What is wrong? / ¿Qué está mal? / O que está errado? }
    validations: { required: true }
  - type: input
    id: source
    attributes: { label: Official source link (law, decree, gov site) / Enlace oficial / Link oficial }
